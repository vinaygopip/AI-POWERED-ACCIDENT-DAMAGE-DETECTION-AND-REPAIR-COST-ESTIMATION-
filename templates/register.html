{% extends "base.html" %}

{% block title %}Create Account – AccidentAI{% endblock %}

{% block content %}
<div style="max-width: 500px; margin: 3rem auto;">
    <div class="glass-card" style="padding: 2.5rem 2rem;">
        <div style="text-align: center; margin-bottom: 1.75rem;">
            <div style="width: 56px; height: 56px; background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.35); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto;">
                <i class="fa-solid fa-user-plus" style="font-size: 1.5rem; color: var(--accent-cyan);"></i>
            </div>
            <h2 style="font-size: 1.6rem; color: var(--text-main);">Create a New Account</h2>
            <p style="color: var(--text-muted); font-size: 0.875rem; margin-top: 0.25rem;">Register to start using the AI vehicle damage scanner</p>
        </div>

        <!-- Register Form -->
        <form id="register-form" action="{{ url_for('register') }}" method="POST">
            <input type="hidden" name="action" value="register">

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user" style="color: var(--accent-cyan);"></i> Full Name</label>
                <input type="text" name="name" class="form-control" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-envelope" style="color: var(--accent-cyan);"></i> Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="user@example.com" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-key" style="color: var(--accent-cyan);"></i> Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-phone" style="color: var(--accent-cyan);"></i> Contact Phone</label>
                <input type="text" name="contact_number" class="form-control" placeholder="+91 9876543210">
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-location-dot" style="color: var(--accent-cyan);"></i> Address</label>
                <input type="text" name="address" class="form-control" placeholder="City, State">
            </div>

            <div class="form-group">
                <label class="form-label"><i class="fa-solid fa-user-gear" style="color: var(--accent-cyan);"></i> Account Role</label>
                <select name="role" class="form-control">
                    <option value="user">Vehicle Owner / User</option>
                    <option value="admin">Administrator / Insurance Assessor</option>
                </select>
            </div>

            <button type="submit" class="btn-custom btn-primary"
                style="width: 100%; margin-top: 1.25rem; padding: 0.85rem; background: linear-gradient(135deg, var(--accent-cyan), var(--primary));">
                <i class="fa-solid fa-user-check"></i> Create Account
            </button>
        </form>

        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem; color: var(--text-muted);">
            Already have an account?
            <a href="{{ url_for('auth') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">
                Sign in here <i class="fa-solid fa-arrow-right" style="font-size: 0.75rem;"></i>
            </a>
        </p>
    </div>
</div>
{% endblock %}
